# NEXT_PUBLIC_GIPHY_API_KEY is a public Giphy client key by design - it's
# meant to ship inside the browser bundle (that's what NEXT_PUBLIC_ means),
# not a leaked secret. Netlify's build-time secrets scanner can't tell the
# difference and fails the build when it finds it, so it's explicitly
# excluded here. Everything else (DATABASE_URL, NEXTAUTH_SECRET,
# CLOUDINARY_API_SECRET, etc.) is still scanned normally.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_GIPHY_API_KEY"

# Baseline security headers for static files. The full set (including the
# Content-Security-Policy) is built in next.config.mjs and applies to every
# page and API response the server renders.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
